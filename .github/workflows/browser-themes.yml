name: Browser themes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/index.py check --collection .
      - run: python3 tools/browser.py check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/browser.py build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint Firefox themes
        run: |
          for theme in browser/*/firefox; do
            npx --yes web-ext@8.10.0 lint --source-dir "$theme" --warnings-as-errors
          done
